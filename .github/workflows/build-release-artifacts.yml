name: Build Release Candidate

# Candidate creation does not publish an update or write to a branch.
# Production artifacts are committed separately after host acceptance.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build candidate
        id: build
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if git ls-files --error-unmatch "dist/zfs-snapsync-${version}-noarch-1.txz" >/dev/null 2>&1; then
            echo 'Choose a new unused VERSION before building a release candidate.' >&2
            exit 1
          fi
          ./scripts/build-release.sh "https://raw.githubusercontent.com/${REPOSITORY}/main/dist"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          sha256sum "dist/zfs-snapsync-${version}-noarch-1.txz"
          python3 scripts/verify-acceptance.py --digest
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ github.sha }}
          path: |
            dist/zfs-snapsync-${{ steps.build.outputs.version }}-noarch-1.txz
            dist/zfs.snapsync.plg
            dist/zfs-snapsync.png
            zfs.snapsync.plg
